<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <!-- Any old GrabLine page (gr33nops.github.io/GrabLine/...) goes to the same
         page on the new site, query and #section included. Other paths are
         not GrabLine's and simply show "not found". -->
    <script>
      if (/^\/GrabLine(\/|$)/i.test(location.pathname)) {
        location.replace(
          "https://grabline.github.io/GrabLine" +
            location.pathname.replace(/^\/GrabLine/i, "") +
            location.search +
            location.hash
        );
      }
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
             background: #07090e; color: #e8eef8; font-family: system-ui, sans-serif; text-align: center; }
      a { color: #60a5fa; }
    </style>
  </head>
  <body>
    <p>Page not found. Looking for GrabLine? It is now at
      <a href="https://grabline.github.io/GrabLine/">grabline.github.io/GrabLine</a>.</p>
  </body>
</html>
