<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrabLine has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://grabline.github.io/GrabLine/" />
    <!-- JavaScript keeps the #section (the app's "Download update" button opens
         #download); the meta refresh is the fallback when scripts are off. -->
    <script>
      location.replace("https://grabline.github.io/GrabLine/" + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://grabline.github.io/GrabLine/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
             background: #07090e; color: #e8eef8; font-family: system-ui, sans-serif; text-align: center; }
      a { color: #60a5fa; }
    </style>
  </head>
  <body>
    <p>GrabLine has moved to <a href="https://grabline.github.io/GrabLine/">grabline.github.io/GrabLine</a>.</p>
  </body>
</html>
